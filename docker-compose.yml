services:

  postgres:
    image: postgres:15-alpine
    container_name: flight_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flight_booking
      POSTGRES_USER: flight_user
      POSTGRES_PASSWORD: flight_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight_user -d flight_booking"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: flight_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_pass
      MONGO_INITDB_DATABASE: flight_nosql
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: python:3.12-slim
    container_name: flight_app
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: flight_booking
      PG_USER: flight_user
      PG_PASS: flight_pass
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: flight_nosql
      MONGO_USER: mongo_user
      MONGO_PASS: mongo_pass
    command: >
      bash -c "pip install -r requirements.txt -q && tail -f /dev/null"

volumes:
  postgres_data:
  mongo_data:
